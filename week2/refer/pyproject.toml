[project]
name = "refer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Keshav", email = "malaxpriya@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
refer = "refer:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
